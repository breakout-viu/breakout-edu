<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Misión 5 · Detectives submarinos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --u: 12.8px;               /* 1 unidad = 1 % del ancho del escenario (lo calcula el JS) */
    --turquesa: #2EE6D6;
    --azul: #0A2A4A;
    --rojo: #FF3B3B;
    --tinta: #04121f;
    --titulo: "Orbitron", "Trebuchet MS", Verdana, Arial, sans-serif;
    --texto: "Nunito", "Trebuchet MS", "Segoe UI", Verdana, Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #020c16; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--texto); color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* Escenario 16:9 que se adapta al iframe */
  #stage { position: relative; overflow: hidden; width: 1280px; height: 720px; font-size: calc(var(--u) * 2.2); }
  #game { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: pointer; }

  /* ---------- Marcadores ---------- */
  #hud {
    position: absolute; top: calc(var(--u) * 1.1); left: calc(var(--u) * 1.3); right: calc(var(--u) * 1.3);
    display: flex; justify-content: space-between; align-items: flex-start; gap: calc(var(--u) * 1);
    pointer-events: none; opacity: 0; transition: opacity .4s;
  }
  #hud.visible { opacity: 1; }
  .pill {
    display: flex; align-items: center; gap: calc(var(--u) * .8);
    background: rgba(4, 22, 40, .84);
    border: calc(var(--u) * .2) solid rgba(46, 230, 214, .45);
    border-radius: calc(var(--u) * 2);
    padding: calc(var(--u) * .6) calc(var(--u) * 1.3);
    font-weight: 800; font-size: calc(var(--u) * 1.8);
    box-shadow: 0 calc(var(--u) * .3) calc(var(--u) * 1) rgba(0, 0, 0, .3);
    white-space: nowrap;
  }
  .pill svg { width: calc(var(--u) * 2.3); height: calc(var(--u) * 2.3); flex: none; }
  .bar {
    width: calc(var(--u) * 12); height: calc(var(--u) * 1.7);
    background: rgba(255, 255, 255, .15);
    border: calc(var(--u) * .2) solid rgba(255, 255, 255, .6);
    border-radius: 999px; overflow: hidden;
  }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 999px; background: linear-gradient(#8ff5ec, #1fb8aa); transition: width .7s ease, background .3s; }
  .bar.mid i { background: linear-gradient(#ffd27a, #f39c12); }
  .bar.low i { background: linear-gradient(#ff9a9a, var(--rojo)); animation: blink 1s infinite; }
  #nivelPill { font-family: var(--titulo); font-weight: 700; font-size: calc(var(--u) * 1.45); letter-spacing: .04em; color: var(--turquesa); }
  #nivelPill .extra { color: #fff; font-family: var(--texto); font-weight: 800; font-size: calc(var(--u) * 1.6); letter-spacing: 0; }
  .derecha { display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--u) * .7); }
  #countNum { font-family: var(--titulo); font-size: calc(var(--u) * 2.2); color: var(--turquesa); min-width: 2.4em; text-align: center; display: inline-block; }
  #reiniciarBtn {
    pointer-events: auto; cursor: pointer;
    font: inherit; font-family: var(--texto); font-weight: 800; font-size: calc(var(--u) * 1.6);
    color: #fff; background: rgba(4, 22, 40, .84);
    border: calc(var(--u) * .2) solid rgba(255, 255, 255, .55); border-radius: 999px;
    padding: calc(var(--u) * .45) calc(var(--u) * 1.3);
    display: flex; align-items: center; gap: calc(var(--u) * .6);
  }
  #reiniciarBtn:hover { border-color: var(--turquesa); }
  #reiniciarBtn svg { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); }
  .pop { animation: pop .6s ease; }
  .hit { animation: shake .45s ease; }
  @keyframes blink { 50% { opacity: .45; } }
  @keyframes pop { 40% { transform: scale(1.2); } }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

  /* ---------- Pantallas superpuestas ---------- */
  .overlay {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 2);
    background: rgba(2, 12, 24, .58);
    opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .overlay.clara { background: rgba(2, 12, 24, .3); }
  .panel {
    width: 100%; max-width: calc(var(--u) * 76); max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, rgba(14, 58, 98, .97), rgba(10, 42, 74, .97));
    border: calc(var(--u) * .3) solid var(--turquesa);
    border-radius: calc(var(--u) * 2.2);
    padding: calc(var(--u) * 2.4) calc(var(--u) * 3.4);
    text-align: center;
    box-shadow: 0 0 calc(var(--u) * 3) rgba(46, 230, 214, .35), 0 calc(var(--u) * 1) calc(var(--u) * 4) rgba(0, 0, 0, .5);
    transform: scale(.9); transition: transform .4s cubic-bezier(.2, 1.4, .4, 1);
  }
  .overlay.show .panel { transform: scale(1); }
  h1, h2 { font-family: var(--titulo); line-height: 1.15; }
  h1 { font-size: calc(var(--u) * 4); font-weight: 900; color: var(--turquesa); text-shadow: 0 0 calc(var(--u) * 1.4) rgba(46, 230, 214, .55); margin-bottom: calc(var(--u) * 1); letter-spacing: .03em; }
  h1.alarma { color: var(--rojo); text-shadow: 0 0 calc(var(--u) * 1.4) rgba(255, 59, 59, .55); font-size: calc(var(--u) * 3.4); }
  h2 { font-size: calc(var(--u) * 2.5); font-weight: 700; }
  p { font-size: calc(var(--u) * 2.3); line-height: 1.4; margin: .35em 0; font-weight: 700; }
  .tag {
    display: inline-block; font-family: var(--titulo); font-weight: 700; letter-spacing: .05em;
    background: var(--turquesa); color: var(--azul);
    font-size: calc(var(--u) * 1.5); border-radius: 999px;
    padding: calc(var(--u) * .4) calc(var(--u) * 1.5); margin-bottom: calc(var(--u) * 1.1);
  }
  .btn {
    font: inherit; font-family: var(--titulo); font-weight: 900; font-size: calc(var(--u) * 2.3); letter-spacing: .04em;
    background: var(--turquesa); color: var(--azul);
    border: none; border-radius: 999px; cursor: pointer;
    padding: calc(var(--u) * 1.1) calc(var(--u) * 4);
    margin-top: calc(var(--u) * 1.8);
    box-shadow: 0 calc(var(--u) * .5) 0 #139a8f, 0 0 calc(var(--u) * 2) rgba(46, 230, 214, .45);
    transition: transform .12s, box-shadow .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(calc(var(--u) * .3)); box-shadow: 0 calc(var(--u) * .2) 0 #139a8f; }
  .btn:focus-visible, .opt:focus-visible, #reiniciarBtn:focus-visible { outline: calc(var(--u) * .4) solid #fff; outline-offset: calc(var(--u) * .4); }

  /* Pregunta */
  .options { display: flex; flex-direction: column; gap: calc(var(--u) * 1); margin-top: calc(var(--u) * 1.8); }
  .opt {
    font: inherit; font-family: var(--texto); font-weight: 800; font-size: calc(var(--u) * 2.3); text-align: left;
    display: flex; align-items: center; gap: calc(var(--u) * 1.3);
    background: #fff; color: var(--tinta);
    border: calc(var(--u) * .3) solid #c9f3ef; border-radius: calc(var(--u) * 1.4);
    padding: calc(var(--u) * .8) calc(var(--u) * 1.5);
    cursor: pointer; transition: transform .12s, background .2s, border-color .2s;
  }
  .opt b {
    flex: none; display: inline-flex; align-items: center; justify-content: center;
    width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--azul); color: #fff; font-family: var(--titulo); font-size: .85em;
  }
  .opt:hover:not(:disabled) { transform: scale(1.02); border-color: var(--turquesa); }
  .opt:disabled { cursor: default; opacity: .7; }
  .opt.ok { background: #a6f7ee; border-color: #13a596; opacity: 1; }
  .opt.ok b { background: #13a596; }
  .opt.ko { background: #ffc4c4; border-color: var(--rojo); opacity: 1; animation: shake .45s; }
  .opt.ko b { background: var(--rojo); }
  #qText { font-family: var(--texto); font-weight: 800; font-size: calc(var(--u) * 2.8); line-height: 1.25; }
  .feedback { min-height: 1.3em; font-size: calc(var(--u) * 2.2); font-weight: 800; margin-top: calc(var(--u) * 1.1); }
  .feedback.ok { color: #8ff5ec; }
  .feedback.ko { color: #ffc2c2; }
  .sabias {
    margin-top: calc(var(--u) * 1.2);
    border: calc(var(--u) * .25) solid var(--turquesa); border-radius: calc(var(--u) * 1.6);
    background: rgba(46, 230, 214, .12);
    padding: calc(var(--u) * 1.4) calc(var(--u) * 2);
  }
  .sabias h2 { color: var(--turquesa); font-size: calc(var(--u) * 2.2); margin-bottom: calc(var(--u) * .6); }
  .sabias p { font-size: calc(var(--u) * 2.5); }
  .oculto { display: none !important; }

  /* Final */
  .adivinanza {
    background: #fff8e1; color: #2d2100;
    border-radius: calc(var(--u) * 1.6);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2);
    margin: calc(var(--u) * 1.3) 0;
    font-size: calc(var(--u) * 2.75); line-height: 1.38; font-style: italic; font-weight: 800;
    box-shadow: inset 0 0 0 calc(var(--u) * .35) #ffd27a, 0 0 calc(var(--u) * 2) rgba(255, 210, 122, .35);
  }
  .caracola { color: var(--turquesa); font-size: calc(var(--u) * 2.3); font-weight: 800; }
  .pista { color: #cfeffd; font-size: calc(var(--u) * 2.1); }
  .pista b { color: var(--turquesa); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" tabindex="0" aria-label="Fondo marino con el submarino"></canvas>

  <!-- Marcadores -->
  <div id="hud">
    <div class="pill" id="oxyPill">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="19" r="8" fill="none" stroke="#bdf6f1" stroke-width="3"/><circle cx="23" cy="9" r="5" fill="none" stroke="#bdf6f1" stroke-width="3"/><circle cx="9.5" cy="16" r="2" fill="#fff"/></svg>
      <span>Oxígeno</span>
      <div class="bar" id="oxyBar"><i id="oxyFill"></i></div>
    </div>
    <div class="pill" id="nivelPill">NIVEL 1</div>
    <div class="derecha">
      <div class="pill" id="counter" aria-live="polite">
        <span>Residuos</span>
        <b id="countNum">0/3</b>
      </div>
      <button id="reiniciarBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M4 4v5h5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="reiniciarTxt">Reiniciar nivel</span>
      </button>
    </div>
  </div>

  <!-- Pantalla inicial -->
  <div class="overlay show" id="startScreen">
    <div class="panel">
      <span class="tag" id="startTag"></span>
      <h1 id="startTitle"></h1>
      <p id="startText"></p>
      <p class="pista" id="startControls"></p>
      <button class="btn" id="startBtn" type="button"></button>
    </div>
  </div>

  <!-- Pregunta -->
  <div class="overlay" id="questionScreen">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="qText" tabindex="-1" style="outline:none">
      <span class="tag" id="qTag">Residuo</span>
      <h2 id="qText"></h2>
      <div class="options" id="qOpts"></div>
      <div class="feedback" id="qFb" aria-live="polite"></div>
      <div class="sabias oculto" id="qSabias">
        <h2 id="qSabiasTitulo"></h2>
        <p id="qSabiasTexto"></p>
      </div>
      <button class="btn oculto" id="qContinuar" type="button"></button>
    </div>
  </div>

  <!-- Zona limpia -->
  <div class="overlay clara" id="levelScreen">
    <div class="panel">
      <h1 id="levelTitle"></h1>
      <h2 id="levelSub"></h2>
      <p class="pista" id="levelNext" style="margin-top:calc(var(--u)*1.4)"></p>
      <button class="btn" id="levelBtn" type="button"></button>
    </div>
  </div>

  <!-- Sin oxígeno -->
  <div class="overlay" id="overScreen">
    <div class="panel">
      <h1 class="alarma" id="overTitle"></h1>
      <p id="overText"></p>
      <button class="btn" id="retryBtn" type="button"></button>
    </div>
  </div>

  <!-- Final -->
  <div class="overlay clara" id="finalScreen">
    <div class="panel" style="max-width:calc(var(--u)*82)">
      <h1 id="finalTitle"></h1>
      <p id="finalIntro"></p>
      <div class="adivinanza" id="finalRiddle"></div>
      <p class="caracola" id="finalCaracola"></p>
    </div>
  </div>
</div>

<script>
(function () {
'use strict';

/* =====================================================================
   CONFIGURACIÓN (edita aquí textos, niveles y preguntas)
   - tipo de residuo: 'botella' | 'bolsa' | 'lata' | 'colilla' | 'pajita' | 'red' | 'vidrio' | 'bolsaRota'
   - x, y: posición en el fondo (escenario de 1280 x 720; el fondo de arena está hacia y = 650)
   - correcta: índice (0, 1 o 2) de la opción correcta. El orden se mezcla al mostrarla.
   - fondo: 'desembocadura' | 'malvarrosa' | 'arrecife'
   - corriente: null (sin corriente) o un objeto:
       fuerza: empuje medio en px/s (velocidad normal del submarino = 330; 165 ≈ avanzar a la mitad contra ella)
       direccion: 1 = hacia la derecha, -1 = hacia la izquierda
       rafagas: true = va por ráfagas (más fuerte unos segundos y luego más suave)
       variacion: cuánto cambia con las ráfagas (0.3 = entre un 70 % y un 130 % de la fuerza)
       periodo: segundos que dura un ciclo de ráfaga
     El empuje nunca pasa del 75 % de la velocidad del submarino, para que siempre pueda avanzar.
   - oscuridad: true/false
   ===================================================================== */
const CONFIG = {
  oxigenoPorFallo: 25,   // % de oxígeno que se pierde por fallo (4 fallos = sin oxígeno; se repite el nivel)
  textos: {
    etiquetaInicio: 'BREAKOUT · CÓDIGO AZUL',
    titulo: 'MISIÓN 5 · DETECTIVES SUBMARINOS',
    instruccion: 'Pilota el submarino, encuentra los residuos y responde para limpiar el fondo del mar.',
    controles: 'Muévete con las <b>flechas</b>, <b>WASD</b> o <b>tocando la pantalla</b>.',
    empezar: 'Empezar',
    nivel: 'NIVEL',
    residuos: 'Residuos',
    reiniciarNivel: 'Reiniciar nivel',
    correcto: '¡Correcto!',
    fallo: '¡Oh, no! Pierdes oxígeno. Podrás intentarlo más tarde.',
    sabiasQue: 'Sabías que…',
    continuar: 'Continuar',
    zonaLimpia: '¡Zona limpia!',
    nivelSuperado: 'Nivel {n} superado',
    siguienteZona: 'Siguiente zona: <b>{nombre}</b>. {aviso}',
    seguir: 'Seguir',
    sinOxigeno: 'Te has quedado sin oxígeno',
    sinOxigenoTexto: '¡No pasa nada! Repites solo esta zona, con el oxígeno lleno.',
    reintentar: 'Volver a intentar',
    corriente: 'Corriente',
    oscuridad: 'Usa el foco'
  },
  final: {
    titulo: '¡Misión cumplida! El fondo marino está limpio.',
    intro: 'Para recuperar el ARCHIVO 5 y su cifra del Código Azul, resolved esta adivinanza:',
    adivinanza: '«Floto sin huesos ni cerebro, soy casi transparente; las tortugas me buscan para comer, pero a veces encuentran plástico en mi lugar.»',
    caracola: '🐚 Arrastrad la caracola que hay junto a las rocas de la izquierda y escribid debajo la respuesta.'
    // Solución (solo para el docente; no se muestra en el juego): MEDUSA
  },
  niveles: [
    {
      nombre: 'La desembocadura',
      fondo: 'desembocadura',
      corriente: null,
      oscuridad: false,
      aviso: '',
      residuos: [
        { tipo: 'lata', nombre: 'Lata', x: 1010, y: 628,
          pregunta: '¿Cómo llegan muchos residuos de la ciudad hasta el mar?',
          opciones: ['Los traen los peces', 'A través de los ríos, las alcantarillas y el viento', 'Caen de las nubes'], correcta: 1,
          sabias: 'Lo que tiramos lejos del mar también puede acabar en él.' },
        { tipo: 'botella', nombre: 'Botella de plástico', x: 360, y: 612,
          pregunta: '¿Cuánto tiempo puede tardar una botella de plástico en degradarse?',
          opciones: ['1 año', '50 años', 'Unos 450 años'], correcta: 2,
          sabias: 'Por eso es tan importante que nunca llegue al mar.' },
        { tipo: 'bolsa', nombre: 'Bolsa de plástico', x: 700, y: 300,
          pregunta: '¿Por qué las bolsas de plástico son tan peligrosas para las tortugas marinas?',
          opciones: ['Las confunden con medusas y se las comen', 'Les dan demasiado calor', 'Las usan para hacer nidos'], correcta: 0,
          sabias: 'Al comérselas, se ponen muy enfermas.' }
      ]
    },
    {
      nombre: 'Frente a la Malvarrosa',
      fondo: 'malvarrosa',
      corriente: { fuerza: 165, direccion: 1, rafagas: true, variacion: 0.3, periodo: 7 },
      oscuridad: false,
      aviso: '¡Cuidado! Una corriente arrastra el submarino hacia un lado.',
      residuos: [
        { tipo: 'lata', nombre: 'Lata', x: 430, y: 640,
          pregunta: '¿En qué contenedor se tira una lata de refresco?',
          opciones: ['Amarillo', 'Azul', 'Verde'], correcta: 0,
          sabias: 'En el amarillo van los envases: plásticos, latas y briks.' },
        { tipo: 'colilla', nombre: 'Colilla', x: 790, y: 652,
          pregunta: '¿Dónde hay que tirar una colilla de cigarro?',
          opciones: ['En la arena, total es pequeña', 'En el contenedor amarillo', 'En una papelera o en el contenedor de resto (gris)'], correcta: 2,
          sabias: 'Las colillas tienen sustancias tóxicas que contaminan el agua.' },
        { tipo: 'pajita', nombre: 'Pajita', x: 1040, y: 320,
          pregunta: '¿Qué es lo mejor para no generar residuos como esta pajita?',
          opciones: ['Tirarla al mar', 'No usar pajitas o usar una reutilizable', 'Usar dos en vez de una'], correcta: 1,
          sabias: 'Reducir es la mejor de las 3 R: reducir, reutilizar y reciclar.' }
      ]
    },
    {
      nombre: 'Arrecife profundo',
      fondo: 'arrecife',
      corriente: null,
      oscuridad: true,
      aviso: 'Está muy oscuro: solo verás lo que ilumine el foco del submarino.',
      residuos: [
        { tipo: 'red', nombre: 'Red de pesca', x: 960, y: 548,
          pregunta: '¿Qué hace una red de pesca abandonada en el mar?',
          opciones: ['Sirve de casa a los peces', 'Sigue atrapando peces, tortugas y delfines', 'Se deshace en una semana'], correcta: 1,
          sabias: 'Por eso se las llama redes fantasma.' },
        { tipo: 'vidrio', nombre: 'Botella de vidrio', x: 520, y: 626,
          pregunta: '¿A qué contenedor va una botella de vidrio?',
          opciones: ['Amarillo', 'Azul', 'Verde'], correcta: 2,
          sabias: 'El vidrio se puede reciclar una y otra vez.' },
        { tipo: 'bolsaRota', nombre: 'Bolsa rota en trocitos', x: 740, y: 320,
          pregunta: '¿Qué le pasa al plástico con el paso del tiempo en el mar?',
          opciones: ['Desaparece del todo', 'Se rompe en trocitos diminutos (microplásticos) que se comen los peces', 'Se convierte en arena'], correcta: 1,
          sabias: 'Y esos microplásticos pueden acabar en nuestra comida.' }
      ]
    }
  ]
};

/* ===================================================================== */

const W = 1280, H = 720;
const $ = (id) => document.getElementById(id);
const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
let scale = 1;

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  let w = vw, h = vw * 9 / 16;
  if (h > vh) { h = vh; w = vh * 16 / 9; }
  w = Math.floor(w); h = Math.floor(h);
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  stage.style.setProperty('--u', (w / 100) + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = dark.width = Math.round(w * dpr);
  cv.height = dark.height = Math.round(h * dpr);
  scale = cv.width / W;
}
window.addEventListener('resize', resize);
resize();

/* ---------- Utilidades ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _rgb = {};
function rgb(h) { if (!_rgb[h]) { const n = parseInt(h.slice(1), 16); _rgb[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]; } return _rgb[h]; }
// Color "vivo": lv = 0 -> gris apagado, lv = 1 -> color original. f oscurece/aclara.
function life(h, lv, a, f) {
  const c = rgb(h); f = f || 1;
  const g = (c[0] * .3 + c[1] * .59 + c[2] * .11) * .72 + 30;
  const ch = (i) => Math.max(0, Math.min(255, (g + (c[i] - g) * lv) * f)) | 0;
  return 'rgba(' + ch(0) + ',' + ch(1) + ',' + ch(2) + ',' + (a == null ? 1 : a) + ')';
}
function mixHex(a, b, t) { const A = rgb(a), B = rgb(b); return 'rgb(' + ((A[0] + (B[0] - A[0]) * t) | 0) + ',' + ((A[1] + (B[1] - A[1]) * t) | 0) + ',' + ((A[2] + (B[2] - A[2]) * t) | 0) + ')'; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function groundY(x) { return 652 + Math.sin(x * .012) * 9 + Math.sin(x * .031 + 1) * 5; }
function drawStar(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath();
}

/* ---------- Decorado de cada fondo (generado una vez, determinista) ---------- */
const rng = mulberry32(55);
function genBranches(x, y, ang, len, depth, out) {
  const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
  out.segs.push([x, y, x2, y2, 3 + depth * 3.4]);
  if (depth === 0) { out.tips.push([x2, y2]); return; }
  genBranches(x2, y2, ang - .4 + (rng() - .5) * .4, len * (.7 + rng() * .12), depth - 1, out);
  genBranches(x2, y2, ang + .4 + (rng() - .5) * .4, len * (.7 + rng() * .12), depth - 1, out);
  if (rng() < .3) genBranches(x2, y2, ang + (rng() - .5) * .3, len * .6, depth - 1, out);
}
function branchCoral(x, y, len, depth, color) { const o = {type: 'branch', color, segs: [], tips: []}; genBranches(x, y, -Math.PI / 2 + (rng() - .5) * .2, len, depth, o); return o; }

const T = CONFIG.textos;

function empezarNivel(n) {
  nivel = n;
  oxygen = 100; cleaned = 0; color = colorTarget = 0;
  oscuro = oscuroTarget = L().oscuridad ? 1 : 0;
  items = L().residuos.map((q) => ({q, x: q.x, y: q.y, state: 'active', armed: true, anim: 0}));
  particles = []; target = null; current = null;
  Object.assign(sub, {x: 140, y: 250, vx: 0, vy: 0, dir: 1, tilt: 0});
  $('nivelPill').innerHTML = T.nivel + ' ' + (n + 1) + ' · ' + L().nombre.toUpperCase() +
    (L().corriente ? ' <span class="extra">· ' + T.corriente + ' <span id="flechaCorriente">' + (L().corriente.direccion < 0 ? '←' : '→') + '</span></span>' : '') +
    (L().oscuridad ? ' <span class="extra">· ' + T.oscuridad + '</span>' : '');

}

function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- Preguntas ---------- */
const qTag = $('qTag'), qText = $('qText'), qOpts = $('qOpts'), qFb = $('qFb'), qSabias = $('qSabias'), qContinuar = $('qContinuar');
let alContinuar = null;
function openQuestion(it) {
  state = 'question'; current = it; answered = false; target = null;
  sub.vx = sub.vy = 0;
  const q = it.q;
  qTag.textContent = q.nombre;
  qText.textContent = q.pregunta;
  qFb.textContent = ''; qFb.className = 'feedback';
  qSabias.classList.add('oculto');
  qContinuar.classList.add('oculto');
  qOpts.classList.remove('oculto');
  qOpts.innerHTML = '';
  shuffle(q.opciones.map((_, i) => i)).forEach((oi, pos) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    const letra = document.createElement('b'); letra.textContent = 'ABC'[pos] || (pos + 1);
    const label = document.createElement('span'); label.textContent = q.opciones[oi];
    b.append(letra, label);
    b.addEventListener('click', () => answer(oi, b));
    qOpts.appendChild(b);
  });
  showScreen('questionScreen');
}
function mostrarContinuar(fn) {
  alContinuar = fn;
  qContinuar.classList.remove('oculto');
  setTimeout(() => qContinuar.focus({preventScroll: true}), 60);
}
qContinuar.addEventListener('click', () => { const fn = alContinuar; alContinuar = null; if (fn) fn(); });

function answer(oi, btn) {
  if (answered || !current) return;
  answered = true;
  qOpts.querySelectorAll('button').forEach(b => b.disabled = true);
  const it = current;
  if (oi === it.q.correcta) {
    btn.classList.add('ok');
    qFb.textContent = T.correcto; qFb.className = 'feedback ok';
    // "Sabías que…" se queda hasta que pulsen Continuar
    setTimeout(() => {
      qOpts.classList.add('oculto');
      $('qSabiasTexto').textContent = it.q.sabias;
      qSabias.classList.remove('oculto');
      mostrarContinuar(() => { showScreen(null); state = 'play'; current = null; recycle(it); });
    }, 700);
  } else {
    btn.classList.add('ko');
    qFb.textContent = T.fallo; qFb.className = 'feedback ko';
    oxygen = Math.max(0, oxygen - CONFIG.oxigenoPorFallo);
    updateHUD('ko');
    it.armed = false;
    for (let i = 0; i < 14; i++) addBubble(sub.x + (Math.random() - .5) * 60, sub.y - 10, 3 + Math.random() * 6, -(60 + Math.random() * 80));
    const dx = sub.x - it.x, dy = sub.y - it.y, d = Math.hypot(dx, dy) || 1;
    mostrarContinuar(() => {
      current = null;
      if (oxygen <= 0) { state = 'over'; showScreen('overScreen'); return; }
      showScreen(null); state = 'play';
      sub.vx = dx / d * 420; sub.vy = dy / d * 420;
    });
  }
}

function recycle(it) {
  it.state = 'recycling'; it.anim = 0;
  cleaned++; colorTarget = cleaned / N();
  if (L().oscuridad) oscuroTarget = 1 - .14 * cleaned;
  updateHUD('ok');
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
    particles.push({k: 's', x: it.x, y: it.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: .9 + Math.random() * .5, c: Math.random() < .5 ? '#2EE6D6' : '#ffe66d', r: 4 + Math.random() * 4});
  }
  particles.push({k: 'r', x: it.x, y: it.y - 10, life: 0, max: 1.6});
  if (cleaned >= N()) {
    colorTarget = 1; oscuroTarget = L().oscuridad ? .18 : 0;
    setTimeout(() => {
      if (nivel < CONFIG.niveles.length - 1) {
        state = 'level';
        const sig = CONFIG.niveles[nivel + 1];
        $('levelSub').textContent = T.nivelSuperado.replace('{n}', nivel + 1);
        $('levelNext').innerHTML = T.siguienteZona.replace('{nombre}', sig.nombre).replace('{aviso}', sig.aviso || '');
        showScreen('levelScreen');
      } else {
        state = 'final';
        hud.classList.remove('visible');
        for (let i = 0; i < 40; i++) addBubble(Math.random() * W, H - 20 - Math.random() * 60, 3 + Math.random() * 7, -(70 + Math.random() * 90));
        showScreen('finalScreen');
      }
    }, 1800);
  }
}

/* ---------- Entrada: teclado ---------- */
const KEYMAP = {ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down'};
window.addEventListener('keydown', (e) => {
  const k = KEYMAP[e.key];
  if (k) { keys[k] = true; if (state === 'play') e.preventDefault(); }
  if (state === 'question' && !answered && !e.repeat && /^[1-3]$/.test(e.key)) {
    const b = qOpts.querySelectorAll('button')[+e.key - 1];
    if (b) b.click();
  }
});
window.addEventListener('keyup', (e) => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

/* ---------- Entrada: ratón y pantalla táctil ---------- */
let pointerDown = false;
function setTarget(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  target = {x: Math.max(70, Math.min(W - 70, x)), y: Math.max(120, Math.min(630, y)), t: 0};
}
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') return;
  e.preventDefault();
  cv.focus({preventScroll: true});
  pointerDown = true; setTarget(e);
  if (cv.setPointerCapture) cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', (e) => { if (pointerDown && state === 'play') setTarget(e); });
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, () => { pointerDown = false; }));

/* ---------- Partículas ---------- */
function addBubble(x, y, r, vy) {
  particles.push({k: 'b', x, y, r, vy: vy || -(30 + Math.random() * 40), ph: Math.random() * 6, life: 0, max: 5 + Math.random() * 3});
}

/* ---------- Corriente (nivel 2) ---------- */
const VEL_SUB = 330;
let corrienteValor = 0, rafagaFuerte = false, estela = 0;
// Empuje de la corriente ahora mismo (px/s, con signo). Con ráfagas: sube y baja de forma suave.
function corrienteAhora() {
  const c = L().corriente;
  if (!c) return 0;
  let f = c.fuerza;
  if (c.rafagas) {
    const a = time * Math.PI * 2 / (c.periodo || 7);
    const g = Math.max(-1, Math.min(1, (Math.sin(a) + .35 * Math.sin(a * 2.3 + 1)) / 1.2));
    f *= 1 + (c.variacion || 0) * g;
  }
  f = Math.min(f, VEL_SUB * .75); // nunca bloquea: siempre se puede avanzar contra ella
  return f * (c.direccion < 0 ? -1 : 1);
}

/* ---------- Actualización ---------- */
function update(dt) {
  time += dt;
  color += (colorTarget - color) * Math.min(1, dt * 1.4);
  oscuro += (oscuroTarget - oscuro) * Math.min(1, dt * 1.2);
  corrienteValor = corrienteAhora();
  estela += Math.abs(corrienteValor) * 2.2 * dt;
  const corr = state === 'play' ? corrienteValor : 0;
  // flecha doble en el marcador durante las ráfagas fuertes
  const c = L().corriente;
  const fuerte = !!c && Math.abs(corrienteValor) > c.fuerza * 1.12;
  if (fuerte !== rafagaFuerte) {
    rafagaFuerte = fuerte;
    const fl = document.getElementById('flechaCorriente');
    if (fl) { const s = c.direccion < 0 ? '←' : '→'; fl.textContent = fuerte ? s + s : s; }
  }

  if (Math.random() < dt * 2.5) addBubble(Math.random() * W, groundY(0) + 10, 2 + Math.random() * 4);

  for (const f of fishes) {
    f.x += f.s * f.sp * dt;
    if (f.x > W + 80) f.x = -80;
    if (f.x < -80) f.x = W + 80;
  }
  const flujo = corrienteValor;
  for (const m of motas) {
    m.x += (flujo * 1.3 + Math.sin(time + m.p) * 6) * dt;
    m.y += Math.sin(time * .7 + m.p) * 4 * dt;
    if (m.x > W + 10) m.x = -10;
    if (m.x < -10) m.x = W + 10;
  }

  if (state === 'play' || state === 'level' || state === 'final') updateSub(dt, corr);

  if (state === 'play') {
    for (const it of items) {
      if (it.state !== 'active') continue;
      const d = Math.hypot(sub.x - it.x, sub.y - it.y);
      if (it.armed && d < 74) { openQuestion(it); break; }
      if (!it.armed && d > 118) it.armed = true;
    }
  }
  for (const it of items) {
    if (it.state === 'recycling') { it.anim += dt / 1.1; if (it.anim >= 1) it.state = 'done'; }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.k === 'b') { p.y += p.vy * dt; p.x += (Math.sin(time * 3 + p.ph) * 18 + flujo * .6) * dt; if (p.y < -20) p.life = p.max; }
    else if (p.k === 's') { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy = p.vy * .96 - 20 * dt; }
    else if (p.k === 'r') { p.y -= 35 * dt; }
    if (p.life >= p.max) particles.splice(i, 1);
  }
  if (target) target.t += dt;
}

function updateSub(dt, corriente) {
  const SP = VEL_SUB;
  let dvx = 0, dvy = 0;
  const ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (state === 'play' && (ix || iy)) {
    target = null;
    const m = Math.hypot(ix, iy);
    dvx = ix / m * SP; dvy = iy / m * SP;
  } else if (state === 'play' && target) {
    const dx = target.x - sub.x, dy = target.y - sub.y, d = Math.hypot(dx, dy);
    if (corriente) {
      // con corriente: motor a tope hasta llegar; al llegar se suelta y la corriente lo arrastra
      if (d < 30) target = null;
      else { dvx = dx / d * SP; dvy = dy / d * SP; }
    } else if (d < 8) target = null;
    else { const s = Math.min(SP, d * 3.2); dvx = dx / d * s; dvy = dy / d * s; }
  }
  const k = Math.min(1, dt * 5);
  sub.vx += (dvx - sub.vx) * k; sub.vy += (dvy - sub.vy) * k;
  sub.x += (sub.vx + corriente) * dt; sub.y += sub.vy * dt;
  if (sub.x < 70) { sub.x = 70; sub.vx = Math.max(0, sub.vx); }
  if (sub.x > W - 70) { sub.x = W - 70; sub.vx = Math.min(0, sub.vx); }
  if (sub.y < 120) { sub.y = 120; sub.vy = 0; }
  if (sub.y > 630) { sub.y = 630; sub.vy = 0; }
  if (sub.vx > 25) sub.dir = 1; else if (sub.vx < -25) sub.dir = -1;
  sub.tilt += ((sub.vy / SP) * .28 - sub.tilt) * k;
  const sp = Math.hypot(sub.vx, sub.vy);
  sub.prop += dt * (4 + sp * .05);
  if (sp > 60 && Math.random() < dt * 14) addBubble(sub.x - sub.dir * 62, sub.y + (Math.random() - .5) * 10, 2 + Math.random() * 3, -25);
}

/* ---------- Dibujo: fondos ---------- */
function drawWater(deco) {
  const lv = color;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mixHex(deco.agua[0][0], deco.agua[0][1], lv));
  g.addColorStop(.45, mixHex(deco.agua[1][0], deco.agua[1][1], lv));
  g.addColorStop(1, mixHex(deco.agua[2][0], deco.agua[2][1], lv));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (L().fondo !== 'arrecife') {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      const x = 120 + i * 270 + Math.sin(time * .35 + i * 1.7) * 40;
      ctx.fillStyle = 'rgba(255,255,255,' + (0.025 + 0.035 * lv) + ')';
      ctx.beginPath(); ctx.moveTo(x - 30, 0); ctx.lineTo(x + 45, 0); ctx.lineTo(x + 190, H * .85); ctx.lineTo(x + 40, H * .85); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // siluetas lejanas
  ctx.fillStyle = 'rgba(0,10,25,0.28)';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, 585 + Math.sin(x * .007 + 2) * 30 + Math.sin(x * .021) * 12);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}

function drawSand(deco) {
  const lv = .45 + .55 * color;
  const g = ctx.createLinearGradient(0, 630, 0, H);
  g.addColorStop(0, life(deco.arena[0], lv)); g.addColorStop(1, life(deco.arena[1], lv));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 16) ctx.lineTo(x, groundY(x));
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  ctx.fillStyle = life(deco.arena[1], lv, .7, .85);
  for (const p of pebbles) { ctx.beginPath(); ctx.ellipse(p[0], p[1], p[2] * 1.4, p[2], 0, 0, Math.PI * 2); ctx.fill(); }
}

function drawMotas(deco, colorMota) {
  const n = Math.round(deco.motas * (1 - .6 * color));
  ctx.fillStyle = colorMota;
  for (let i = 0; i < n && i < motas.length; i++) { const m = motas[i]; circle(m.x, m.y, m.r); ctx.fill(); }
}

function drawCanas(deco) {
  ctx.lineCap = 'round';
  for (const c of deco.canas) {
    const base = groundY(c.x) + 10;
    const sway = Math.sin(time * 1.1 + c.p) * 10;
    ctx.strokeStyle = life('#7c8a3a', .35 + .65 * color); ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(c.x, base); ctx.quadraticCurveTo(c.x + sway * .4, base - c.h * .5, c.x + sway, base - c.h); ctx.stroke();
    // hoja
    ctx.strokeStyle = life('#93a64a', .35 + .65 * color); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(c.x, base - c.h * .35); ctx.quadraticCurveTo(c.x + 30 + sway, base - c.h * .55, c.x + 46 + sway, base - c.h * .45); ctx.stroke();
    // espiga
    ctx.fillStyle = life('#7a4f2a', .4 + .6 * color);
    ctx.beginPath(); ctx.ellipse(c.x + sway, base - c.h - 14, 6, 18, sway * .02, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPosidonia(deco, delante) {
  ctx.lineCap = 'round';
  deco.posidonia.forEach((p, idx) => {
    if ((idx % 3 === 0) !== delante) return;
    const base = groundY(p.x) + 8;
    ctx.strokeStyle = life(p.c, .35 + .65 * color); ctx.lineWidth = 7;
    for (let b = -1; b <= 1; b++) {
      const sway = Math.sin(time * 1.5 + p.p + b) * 14 + corrienteValor * .16;
      ctx.beginPath(); ctx.moveTo(p.x + b * 5, base);
      ctx.quadraticCurveTo(p.x + b * 9 + sway * .4, base - p.h * .55, p.x + b * 12 + sway, base - p.h * (0.8 + .2 * Math.abs(b - 1) / 2));
      ctx.stroke();
    }
  });
}

function drawConchas(deco) {
  for (const s of deco.conchas) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.fillStyle = life(s.c, .5 + .5 * color);
    ctx.beginPath(); ctx.moveTo(0, s.r * .6); ctx.arc(0, s.r * .6, s.r * 1.2, Math.PI * 1.15, Math.PI * 1.85); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,40,0.45)'; ctx.lineWidth = 1.5;
    for (let a = -3; a <= 3; a++) { ctx.beginPath(); ctx.moveTo(0, s.r * .6); ctx.lineTo(Math.sin(a * .28) * s.r * 1.15, s.r * .6 - Math.cos(a * .28) * s.r * 1.15); ctx.stroke(); }
    ctx.restore();
  }
}

function drawRocas(lista, col) {
  for (const r of lista) {
    ctx.fillStyle = life(col, .5 + .5 * color);
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.rx, r.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = life(col, .5 + .5 * color, 1, .78);
    ctx.beginPath(); ctx.ellipse(r.x + r.rx * .12, r.y + r.ry * .35, r.rx * .85, r.ry * .6, 0, 0, Math.PI * 2); ctx.fill();
  }
}

function drawArrecife(deco) {
  const lv = color;
  for (const p of deco.partes) {
    if (p.type === 'rock') { drawRocas([p], p.color); }
    else if (p.type === 'branch') {
      ctx.strokeStyle = life(p.color, lv); ctx.lineCap = 'round';
      for (const s of p.segs) { ctx.lineWidth = s[4]; ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke(); }
      ctx.fillStyle = life(p.color, lv, 1, 1.2);
      for (const t of p.tips) { circle(t[0], t[1], 5); ctx.fill(); }
    } else if (p.type === 'brain') {
      ctx.fillStyle = life(p.color, lv);
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * .72, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.strokeStyle = life(p.color, lv, 1, .7); ctx.lineWidth = 3;
      for (let k = 1; k <= 4; k++) { const yy = p.y - k * p.r * .15; ctx.beginPath(); for (let x = p.x - p.r; x <= p.x + p.r; x += 4) ctx.lineTo(x, yy + Math.sin(x * .2 + k) * 4); ctx.stroke(); }
      ctx.restore();
    } else if (p.type === 'fan') {
      ctx.strokeStyle = life(p.color, lv, .9); ctx.lineWidth = 3; ctx.lineCap = 'round';
      const sway = Math.sin(time * .8) * .04;
      for (let a = -Math.PI * .92; a <= -Math.PI * .08; a += Math.PI / 13) { ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a + sway) * p.r, p.y + Math.sin(a + sway) * p.r); ctx.stroke(); }
      ctx.lineWidth = 2;
      for (const f of [.45, .7, .95]) { ctx.beginPath(); ctx.arc(p.x, p.y, p.r * f, -Math.PI * .92 + sway, -Math.PI * .08 + sway); ctx.stroke(); }
    } else if (p.type === 'tubes') {
      [[-34, 72], [-12, 100], [10, 64]].forEach(t => {
        ctx.fillStyle = life(p.color, lv); rr(ctx, p.x + t[0], p.y - t[1], 20, t[1], 8); ctx.fill();
        ctx.fillStyle = life(p.color, lv, 1, .45); ctx.beginPath(); ctx.ellipse(p.x + t[0] + 10, p.y - t[1] + 5, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      });
    } else if (p.type === 'anemone') {
      ctx.strokeStyle = life(p.color, lv); ctx.lineWidth = 6; ctx.lineCap = 'round';
      for (let i = 0; i < 11; i++) {
        const a = -Math.PI + (i + .5) / 11 * Math.PI + Math.sin(time * 2 + i * .6) * .22;
        ctx.beginPath(); ctx.moveTo(p.x, p.y - 6);
        ctx.quadraticCurveTo(p.x + Math.cos(a) * 14, p.y - 6 + Math.sin(a) * 18, p.x + Math.cos(a) * 32, p.y - 6 + Math.sin(a) * 34); ctx.stroke();
      }
      ctx.fillStyle = life(p.color, lv, 1, .75); ctx.beginPath(); ctx.ellipse(p.x, p.y, 17, 10, 0, 0, Math.PI * 2); ctx.fill();
    } else if (p.type === 'star') {
      ctx.fillStyle = life(p.color, lv); drawStar(p.x, p.y, p.r, p.rot); ctx.fill();
      ctx.strokeStyle = life(p.color, lv, 1, .7); ctx.lineWidth = 2; ctx.stroke();
    }
  }
}

function drawFish(f, alpha) {
  const y = f.y + Math.sin(time * 1.8 + f.ph) * 12;
  ctx.save(); ctx.translate(f.x, y); ctx.scale(f.s * f.z, f.z);
  ctx.globalAlpha = alpha;
  const wag = Math.sin(time * 9 + f.ph) * 5;
  ctx.fillStyle = life(f.c, color);
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-36, -12 + wag); ctx.lineTo(-36, 12 + wag); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 0, 24, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; circle(12, -3, 4.5); ctx.fill();
  ctx.fillStyle = '#111'; circle(13, -3, 2.2); ctx.fill();
  ctx.restore();
}

function drawCorriente() {
  const c = L().corriente;
  if (!c) return;
  const fuerza = Math.abs(corrienteValor) / c.fuerza; // ~0,7 suave … ~1,3 ráfaga
  const dir = c.direccion < 0 ? -1 : 1;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const n = Math.round(16 + 14 * fuerza);
  for (let i = 0; i < n; i++) {
    const y = 130 + (i * 97) % 490;
    const base = (estela * (0.8 + (i % 3) * .2) + i * 211) % (W + 300);
    const x = dir > 0 ? base - 150 : W + 150 - base;
    const len = (40 + (i % 4) * 16) * (0.6 + fuerza * .7);
    ctx.globalAlpha = (.18 + .14 * Math.sin(time * 2 + i)) * (0.6 + fuerza * .6);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + dir * len * .5, y - 6, x + dir * len, y); ctx.stroke();
  }
  ctx.restore();
}

function drawFondo() {
  const deco = DECO[L().fondo];
  drawWater(deco);
  if (L().fondo === 'desembocadura') {
    drawMotas(deco, 'rgba(120,95,55,0.45)');
    drawSand(deco);
    drawRocas(deco.rocas, '#6d6150');
    drawCanas(deco);
    fishes.slice(0, 2).forEach(f => drawFish(f, .25 + .75 * color));
  } else if (L().fondo === 'malvarrosa') {
    drawPosidonia(deco, false);
    drawSand(deco);
    drawConchas(deco);
    fishes.forEach(f => drawFish(f, .5 + .5 * color));
    drawMotas(deco, 'rgba(255,255,255,0.35)');
    drawCorriente();
  } else {
    drawSand(deco);
    drawArrecife(deco);
    fishes.forEach(f => drawFish(f, .3 + .7 * color));
    drawMotas(deco, 'rgba(180,220,255,0.25)');
  }
}

function drawItem(it) {
  if (it.state === 'done') return;
  ctx.save();
  ctx.translate(it.x, it.y);
  if (it.state === 'active') {
    const pulse = .5 + .5 * Math.sin(time * 3 + it.x);
    const R = 58 + pulse * 6;
    ctx.globalAlpha = it.armed ? 1 : .35;
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, R);
    g.addColorStop(0, 'rgba(46,230,214,.28)'); g.addColorStop(1, 'rgba(46,230,214,0)');
    ctx.fillStyle = g; circle(0, 0, R); ctx.fill();
    ctx.setLineDash([10, 8]); ctx.lineDashOffset = -time * 25;
    ctx.strokeStyle = 'rgba(46,230,214,.95)'; ctx.lineWidth = 3; circle(0, 0, R); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = it.armed ? 1 : .6;
  } else {
    const t = it.anim, e = t * t;
    ctx.translate(0, -t * 50); ctx.rotate(t * 6); ctx.scale(1 - e, 1 - e);
    ctx.globalAlpha = 1 - e;
  }
  if (DRAW[it.q.tipo]) DRAW[it.q.tipo]();
  ctx.restore();
}

// Destellos que ayudan a encontrar los residuos en la oscuridad
function drawDestellos() {
  for (const it of items) {
    if (it.state !== 'active') continue;
    const fase = (time * .9 + it.x * .01) % 2;
    const a = fase < .5 ? Math.sin(fase / .5 * Math.PI) : 0;
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a * .85;
    ctx.fillStyle = '#bdfbf5';
    drawStar(it.x + 12, it.y - 14, 12, time); ctx.fill();
    ctx.restore();
  }
}

function drawRecycleBadge(x, y, s, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = alpha;
  ctx.fillStyle = '#13a596'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  circle(0, 0, 26); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.fillStyle = '#fff';
  for (let k = 0; k < 3; k++) {
    ctx.save(); ctx.rotate(k * Math.PI * 2 / 3 + time * 1.5);
    ctx.beginPath(); ctx.arc(0, 0, 14, -.25, 1.45); ctx.stroke();
    const a = 1.45, ax = Math.cos(a) * 14, ay = Math.sin(a) * 14, tx = -Math.sin(a), ty = Math.cos(a), nx = Math.cos(a), ny = Math.sin(a);
    ctx.beginPath(); ctx.moveTo(ax + tx * 8, ay + ty * 8); ctx.lineTo(ax + nx * 6, ay + ny * 6); ctx.lineTo(ax - nx * 6, ay - ny * 6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---------- Dibujo: submarino amarillo ---------- */
const FOCO = {x: 66, y: 4}; // punto del foco delantero (coordenadas locales del submarino)
const CONTORNO = '#1b1b1b';

function casco() {
  ctx.beginPath();
  ctx.moveTo(-58, 2);
  ctx.bezierCurveTo(-58, -24, -24, -36, 8, -36);
  ctx.bezierCurveTo(44, -36, 66, -18, 66, 2);
  ctx.bezierCurveTo(66, 20, 44, 36, 8, 36);
  ctx.bezierCurveTo(-24, 36, -58, 26, -58, 2);
  ctx.closePath();
}
function remache(x, y) { ctx.fillStyle = '#d99a00'; circle(x, y, 2.2); ctx.fill(); ctx.strokeStyle = 'rgba(60,40,0,.7)'; ctx.lineWidth = 1; ctx.stroke(); }
function ojoDeBuey(x, y) {
  ctx.fillStyle = '#aeb6be'; circle(x, y, 11.5); ctx.fill();
  ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2.5; ctx.stroke();
  const g = ctx.createRadialGradient(x - 2, y - 3, 1, x, y, 8);
  g.addColorStop(0, '#9af0ff'); g.addColorStop(1, '#1597d8');
  ctx.fillStyle = g; circle(x, y, 7.8); ctx.fill();
  ctx.strokeStyle = '#5d6770'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y, 5, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
  ctx.fillStyle = '#6c757d';
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + .5; circle(x + Math.cos(a) * 9.7, y + Math.sin(a) * 9.7, 1.1); ctx.fill(); }
}

function drawSubmarino() {
  const bob = Math.sin(time * 2.2) * 3;
  ctx.save(); ctx.translate(sub.x, sub.y + bob); ctx.scale(sub.dir, 1); ctx.rotate(sub.tilt);
  ctx.lineJoin = 'round';
  // haz de luz (en el nivel oscuro lo hace la capa de oscuridad)
  if (!L().oscuridad) {
    const lg = ctx.createLinearGradient(FOCO.x, 0, 250, 0);
    lg.addColorStop(0, 'rgba(255,245,190,.42)'); lg.addColorStop(1, 'rgba(255,245,190,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(FOCO.x, FOCO.y - 4); ctx.lineTo(250, -44); ctx.lineTo(250, 56); ctx.lineTo(FOCO.x, FOCO.y + 4); ctx.closePath(); ctx.fill();
  }
  // aletas de cola (naranjas)
  for (const s of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(-34, 14 * s); ctx.lineTo(-74, 48 * s); ctx.lineTo(-54, 2 * s); ctx.closePath();
    ctx.fillStyle = '#ff6b2c'; ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = 'rgba(150,40,0,.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-46, 12 * s); ctx.lineTo(-68, 40 * s); ctx.stroke();
  }
  // eje y hélice
  rr(ctx, -74, -7, 20, 14, 4); ctx.fillStyle = '#9aa3ab'; ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2.5; ctx.stroke();
  const b1 = Math.abs(Math.sin(sub.prop * 6)), b2 = Math.abs(Math.cos(sub.prop * 6));
  for (const [sgn, b] of [[-1, b1], [1, b2]]) {
    ctx.beginPath(); ctx.ellipse(-80, sgn * (13 * b + 1), 6, 13 * b + 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#d5dade'; ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2.2; ctx.stroke();
  }
  ctx.fillStyle = '#9aa3ab'; circle(-80, 0, 4.5); ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2; ctx.stroke();
  // periscopio
  ctx.lineCap = 'round';
  ctx.strokeStyle = CONTORNO; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(8, -52); ctx.lineTo(8, -74); ctx.lineTo(26, -74); ctx.stroke();
  ctx.strokeStyle = '#a7b0b8'; ctx.lineWidth = 6.5;
  ctx.beginPath(); ctx.moveTo(8, -52); ctx.lineTo(8, -74); ctx.lineTo(26, -74); ctx.stroke();
  ctx.fillStyle = '#5ad1ff'; ctx.beginPath(); ctx.ellipse(29, -74, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2; ctx.stroke();
  // torreta
  const gt = ctx.createLinearGradient(0, -58, 0, -30);
  gt.addColorStop(0, '#ffe55c'); gt.addColorStop(1, '#f2b200');
  rr(ctx, -18, -56, 50, 28, 9); ctx.fillStyle = gt; ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 3; ctx.stroke();
  rr(ctx, -10, -50, 34, 16, 3); ctx.strokeStyle = 'rgba(80,55,0,.65)'; ctx.lineWidth = 1.5; ctx.stroke();
  remache(-7, -47); remache(21, -47); remache(-7, -37); remache(21, -37);
  // casco
  const g = ctx.createLinearGradient(0, -36, 0, 36);
  g.addColorStop(0, '#ffe24d'); g.addColorStop(.55, '#ffc400'); g.addColorStop(1, '#f29a00');
  casco(); ctx.fillStyle = g; ctx.fill();
  ctx.save(); casco(); ctx.clip();
  // franja roja
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = 7; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(-60, 10); ctx.quadraticCurveTo(4, 26, 68, 10); ctx.stroke();
  // juntas de las placas
  ctx.strokeStyle = 'rgba(90,60,0,.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(-36, -30); ctx.quadraticCurveTo(-44, 2, -36, 32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(48, -28); ctx.quadraticCurveTo(56, 2, 48, 30); ctx.stroke();
  // brillo
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(6, -24, 34, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  casco(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 3.5; ctx.stroke();
  // escotilla inferior
  rr(ctx, -10, 24, 40, 9, 4); ctx.fillStyle = '#f0a000'; ctx.fill(); ctx.strokeStyle = 'rgba(60,40,0,.8)'; ctx.lineWidth = 1.6; ctx.stroke();
  // remaches del casco
  [[-46, -14], [-48, 2], [-46, 18], [-28, -28], [42, -24], [56, -8], [56, 12], [44, 26], [-26, 28]].forEach(([x, y]) => remache(x, y));
  // ojos de buey
  ojoDeBuey(-22, -4); ojoDeBuey(6, -4); ojoDeBuey(34, -4);
  // foco delantero
  ctx.fillStyle = '#aeb6be'; circle(FOCO.x - 2, FOCO.y, 8); ctx.fill(); ctx.strokeStyle = CONTORNO; ctx.lineWidth = 2.5; ctx.stroke();
  const gl = ctx.createRadialGradient(FOCO.x, FOCO.y, 0, FOCO.x, FOCO.y, 6);
  gl.addColorStop(0, '#ffffff'); gl.addColorStop(1, '#ffe98a');
  ctx.fillStyle = gl; circle(FOCO.x, FOCO.y, 5); ctx.fill();
  ctx.restore();
}

/* ---------- Oscuridad del nivel 3: solo se ve lo que ilumina el foco ---------- */
function drawOscuridad() {
  if (oscuro <= 0.01) return;
  dctx.setTransform(scale, 0, 0, scale, 0, 0);
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  dctx.fillStyle = 'rgba(1,6,14,' + Math.min(.95, oscuro * .95) + ')';
  dctx.fillRect(0, 0, W, H);
  dctx.globalCompositeOperation = 'destination-out';
  const bob = Math.sin(time * 2.2) * 3;
  const x = sub.x, y = sub.y + bob;
  // halo alrededor del submarino
  let g = dctx.createRadialGradient(x, y, 20, x, y, 175);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.6, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, 175, 0, Math.PI * 2); dctx.fill();
  // cono del foco hacia delante
  const ang = sub.dir > 0 ? sub.tilt : Math.PI - sub.tilt;
  // el cono sale del foco delantero del submarino (FOCO, girado con la inclinación)
  const fx = FOCO.x * sub.dir, fy = FOCO.y;
  const ca = Math.cos(sub.tilt * sub.dir), sa = Math.sin(sub.tilt * sub.dir);
  const ox = x + fx * ca - fy * sa, oy = y + fx * sa + fy * ca;
  const LARGO = 470, AB = .42;
  g = dctx.createRadialGradient(ox, oy, 10, ox, oy, LARGO);
  g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.65, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  dctx.fillStyle = g;
  dctx.beginPath(); dctx.moveTo(ox, oy);
  dctx.arc(ox, oy, LARGO, ang - AB, ang + AB);
  dctx.closePath(); dctx.fill();
  dctx.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(dark, 0, 0); ctx.restore();
  // un leve tono cálido dentro del cono
  ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = .25 * oscuro;
  ctx.fillStyle = '#fff2c0'; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.arc(ox, oy, LARGO * .8, ang - AB, ang + AB); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.life / p.max;
    if (p.k === 'b') {
      ctx.strokeStyle = 'rgba(255,255,255,' + (.6 * Math.min(1, a * 3)) + ')'; ctx.lineWidth = 1.5;
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      circle(p.x, p.y, p.r); ctx.fill(); ctx.stroke();
    } else if (p.k === 's') {
      ctx.globalAlpha = a; ctx.fillStyle = p.c; drawStar(p.x, p.y, p.r, time * 4); ctx.fill(); ctx.globalAlpha = 1;
    } else if (p.k === 'r') {
      const t = p.life / p.max;
      drawRecycleBadge(p.x, p.y, .6 + Math.min(1, t * 4) * .6, t < .7 ? 1 : (1 - t) / .3);
    }
  }
}

function drawTarget() {
  if (!target || state !== 'play') return;
  const a = Math.max(0, 1 - target.t * .8);
  if (a <= 0) return;
  ctx.strokeStyle = 'rgba(46,230,214,' + (.9 * a) + ')'; ctx.lineWidth = 3;
  circle(target.x, target.y, 10 + (target.t * 30) % 18); ctx.stroke();
  circle(target.x, target.y, 4); ctx.fillStyle = 'rgba(255,255,255,' + a + ')'; ctx.fill();
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  drawFondo();
  if (L().fondo === 'malvarrosa') drawPosidonia(DECO.malvarrosa, true);
  items.forEach(drawItem);
  drawTarget();
  drawSubmarino();
  if (L().oscuridad) { drawOscuridad(); ctx.setTransform(scale, 0, 0, scale, 0, 0); drawDestellos(); }
  drawParticles();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .72);
  v.addColorStop(0, 'rgba(0,10,25,0)'); v.addColorStop(1, 'rgba(0,10,25,.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
// Estado inicial (detrás de la pantalla de inicio se ve el nivel 1)
items = L().residuos.map((q) => ({q, x: q.x, y: q.y, state: 'active', armed: true, anim: 0}));
updateHUD(false);
requestAnimationFrame(loop);
})();
</script>
